plugins {
	id 'java'
	id 'jacoco'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dependency.management)
}

group = 'com.videos'
version = '1.0.0'
description = 'Video context: videos, their completion state and who owns them'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(libs.versions.java.get() as int)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom libs.spring.cloud.dependencies.get().toString()
	}
}

dependencies {
	implementation libs.platform.security.starter
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation libs.springdoc.webmvc.ui
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation libs.nimbus.jose.jwt
	testImplementation libs.archunit.junit5
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
	archiveFileName = 'application.jar'
}

jar {
	enabled = false
}

jacoco {
	toolVersion = libs.versions.jacoco.get()
}

test {
	useJUnitPlatform()
	// Tests configure everything themselves; no config server, Vault or registry is involved.
	systemProperty 'spring.cloud.config.enabled', 'false'
	systemProperty 'spring.cloud.vault.enabled', 'false'
	systemProperty 'eureka.client.enabled', 'false'
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = true
	}
}

// The domain and application layers carry the rules; they must stay at or above 80% line coverage.
jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
	classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
		fileTree(dir: it, includes: ['com/videos/domain/**', 'com/videos/application/**'])
	}))
}

check {
	dependsOn jacocoTestCoverageVerification
}
